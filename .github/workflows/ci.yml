name: CI

on:
  push:
    branches: [main, "rewrite/**"]
  pull_request:

permissions:
  contents: read

jobs:
  examples:
    name: Build examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check examples are in sync
        run: python3 scripts/extract_examples.py --check

      - name: Build all examples
        run: make -C examples -j"$(nproc)" CFLAGS="-std=c11 -Wall -Wextra -Werror -pedantic"

      - name: Verify example output
        run: python3 scripts/verify_examples.py

  docs:
    name: Lint docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links
        run: python3 scripts/check_links.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.24.0
